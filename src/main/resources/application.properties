spring.application.name=DocChat-AI

spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

spring.ai.google.genai.chat.model=gemini-3.8-flash

spring.ai.model.chat=google-genai

spring.datasource.url=jdbc:postgresql://localhost:5433/docchat
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.model.embedding=ollama

# ==========================================
# VECTOR STORE CONFIGURATION
# ==========================================

# Disable S3 Vector Store auto-configuration
# This prevents the "Bucket name cannot be null" error
#spring.ai.vectorstore.s3.enabled=false

# pgvector with PostgreSQL configuration
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ==========================================
# FLYWAY CONFIGURATION
# ==========================================

# Flyway database migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.schemas=public
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==========================================
# ADDITIONAL SPRING CONFIG
# ==========================================

# Show SQL queries
spring.jpa.show-sql=true

# Server port
server.port=8080

app.aws.s3.bucket=${AWS_S3_BUCKET}
app.aws.s3.region=${AWS_REGION}
app.aws.s3.profile= ${AWS_PROFILE}
