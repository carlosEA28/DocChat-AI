services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg15-trixie
    environment:
      POSTGRES_DB: docchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pg_data:
