version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: docchat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-sql:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  pg_data: